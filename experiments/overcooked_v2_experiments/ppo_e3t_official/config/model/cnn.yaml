"TYPE": "CNN"
"FC_DIM_SIZE": 64
"ACTIVATION": "relu"

"ARCH": "cnn"
"CNN_FEATURES": 32

"TOTAL_TIMESTEPS": 1e7
"REW_SHAPING_HORIZON": 5e6

"GAMMA": 0.99
"GAE_LAMBDA": 0.95
"SCALE_CLIP_EPS": False
"VF_COEF": 0.5
"MAX_GRAD_NORM": 0.5
"ANNEAL_LR": True
"LR_WARMUP": 0.05

"LR": 4e-4
"NUM_ENVS": 64
"NUM_STEPS": 256
"UPDATE_EPOCHS": 4
"NUM_MINIBATCHES": 16
"CLIP_EPS": 0.2
"ENT_COEF": 0.04

# original overcooked
# "LR": 4e-4
